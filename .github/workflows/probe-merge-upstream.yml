name: Probe fork sync via merge-upstream API

# Temporary probe. Checks whether the merge-upstream REST endpoint can
# fast-forward main past a commit that touches .github/workflows using only
# GITHUB_TOKEN. A git push cannot: GITHUB_TOKEN is a GitHub App installation
# token, and app tokens need a Workflows:write permission that the workflow
# `permissions:` block does not expose. Delete this file once the question is
# answered either way.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    if: github.repository == 'dan13bauer/velox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream main
        run: git fetch https://github.com/facebookincubator/velox.git main:refs/remotes/upstream/main

      - name: Verify main has not diverged from upstream
        run: |
          if ! git merge-base --is-ancestor HEAD upstream/main; then
            echo "::error::main has commit(s) that upstream/main does not. Refusing to sync." >&2
            exit 1
          fi

      - name: Require a workflow-file change in the pending range
        run: |
          echo "Pending commits touching .github/workflows:"
          git log --oneline HEAD..upstream/main -- .github/workflows/
          if [ -z "$(git log --format=%H HEAD..upstream/main -- .github/workflows/)" ]; then
            echo "::error::Pending range touches no workflow files, so a successful sync would prove nothing. Aborting probe." >&2
            exit 1
          fi

      - name: Fast-forward main via merge-upstream API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
