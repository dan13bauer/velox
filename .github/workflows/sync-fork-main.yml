name: Sync fork main from upstream

# Keeps dan13bauer/velox's main fast-forwarded to
# facebookincubator/velox's main every 15 minutes. main on this fork is
# expected to never carry unique commits (feature work happens on separate
# branches), so this only ever fast-forwards. If main has diverged, the verify
# step fails the run instead of merging or force-pushing over it.
#
# The fast-forward goes through the merge-upstream REST endpoint rather than
# `git push`. GITHUB_TOKEN is a GitHub App installation token, and app tokens
# may only write under .github/workflows with a Workflows:write permission that
# the workflow `permissions:` block does not expose, so pushing any upstream
# range that touches a workflow file is rejected outright. The endpoint moves
# the ref onto objects that already exist upstream and is not subject to that
# guard.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'dan13bauer/velox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream main
        run: git fetch https://github.com/facebookincubator/velox.git main:refs/remotes/upstream/main

      - name: Verify main has not diverged from upstream
        run: |
          if ! git merge-base --is-ancestor HEAD upstream/main; then
            echo "::error::main has commit(s) that upstream/main does not. Someone pushed directly to main instead of a feature branch. Refusing to sync until this is resolved manually." >&2
            exit 1
          fi

      - name: Fast-forward main to upstream/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          merge_type=$(gh api --method POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch=main --jq '.merge_type')
          echo "merge_type=${merge_type}"
          # The verify step rules out divergence, so anything but a
          # fast-forward, or a no-op when main is already current, means the
          # ref moved between that check and this call.
          if [ "${merge_type}" != "fast-forward" ] && [ "${merge_type}" != "none" ]; then
            echo "::error::Expected a fast-forward but the endpoint reported: ${merge_type}" >&2
            exit 1
          fi
